<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | AI Powered Adaptive Learning</title>
    <meta name="description" content="AI-powered adaptive solar-system learning experience with voice interaction and WebXR support.">
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      /* Critical layout is inline so a browser cannot reuse the fixed-size CSS
         from an older WebXR build after Unity replaces files with the same names. */
      html, body { width: 100%; height: 100%; padding: 0; margin: 0; overflow: hidden; background: #020712; }
      #unity-container { position: fixed; inset: 0; left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh; transform: none; }
      #unity-canvas-container { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }
      #unity-canvas { display: block; width: 100% !important; height: 100% !important; }
      #unity-footer { position: fixed; z-index: 20; right: 12px; bottom: 12px; width: auto; display: flex; gap: 8px; pointer-events: none; }
      #unity-fullscreen-button, #entervr, #enterar { pointer-events: auto; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <div id="unity-canvas-container" style="width: 100%; height: 100%;">
        <canvas id="unity-canvas" style="width: 100%; height: 100%;"></canvas>
      </div>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-footer">
        <button id="unity-fullscreen-button" type="button" aria-label="Enter fullscreen">FULLSCREEN</button>
        <button id="entervr" value="Enter VR" disabled>VR</button>
        <button id="enterar" value="Enter AR" disabled>AR</button>
      </div>
    </div>
    <script>
      var buildUrl = "Build";
      var buildVersion = new URLSearchParams(window.location.search).get("build") || "latest";
      var assetVersion = "?v=" + encodeURIComponent(buildVersion);
      var loaderUrl = buildUrl + "/WebGL.loader.js" + assetVersion;
      var config = {
        dataUrl: buildUrl + "/WebGL.data.unityweb" + assetVersion,
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb" + assetVersion,
        codeUrl: buildUrl + "/WebGL.wasm.unityweb" + assetVersion,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "AI Powered Adaptive Learning",
        productVersion: "0.1.0",
        autoSyncPersistentDataPath: true,
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.25),
      };

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var canvasContainer = document.querySelector("#unity-canvas-container");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var unityInstance = null;

      function showStartOverlay() {
        var overlay = document.createElement("div");
        overlay.id = "start-overlay";
        overlay.style.cssText = "position:fixed;inset:0;background:rgba(2,7,18,0.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;cursor:pointer;-webkit-tap-highlight-color:transparent;";
        overlay.innerHTML = '<div style="text-align:center;color:#fff;pointer-events:none;padding:20px;">' +
          '<div style="font-family:system-ui,-apple-system,sans-serif;font-size:22px;font-weight:700;letter-spacing:3px;color:#38bdf8;margin-bottom:8px;">METABOOK AI</div>' +
          '<div style="font-family:system-ui,-apple-system,sans-serif;font-size:30px;font-weight:800;letter-spacing:1px;margin-bottom:28px;">INTERACTIVE SOLAR SYSTEM</div>' +
          '<div style="display:inline-block;padding:15px 42px;background:#38bdf8;color:#020712;font-size:18px;font-weight:800;border-radius:50px;letter-spacing:1.5px;box-shadow:0 0 30px rgba(56,189,248,0.5);">' +
          'TAP TO ENTER' +
          '</div></div>';
        function onStart() {
          overlay.remove();
          if (typeof WEBAudio !== 'undefined' && WEBAudio.audioContext && WEBAudio.audioContext.state === 'suspended') {
            WEBAudio.audioContext.resume();
          }
          if (unityInstance) {
            try {
              unityInstance.SendMessage("Timeline", "OnUserStartExperience");
            } catch(e) {}
            try {
              unityInstance.SendMessage("Intro2", "OnUserStartExperience");
            } catch(e) {}
          }
          if (canvas) {
            try { canvas.focus(); } catch(e) {}
          }
        }
        overlay.addEventListener("click", onStart, { once: true });
        overlay.addEventListener("touchend", onStart, { once: true });
        document.body.appendChild(overlay);
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((instance) => {
          unityInstance = instance;
          loadingBar.style.display = "none";
          showStartOverlay();
          if (fullscreenButton)
          {
            fullscreenButton.onclick = () => {
              unityInstance.SetFullscreen(1);
            };
          }
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);

      let enterARButton = document.getElementById('enterar');
      let enterVRButton = document.getElementById('entervr');

      document.addEventListener('onARSupportedCheck', function (event) {
        enterARButton.disabled = !event.detail.supported;
      }, false);
      document.addEventListener('onVRSupportedCheck', function (event) {
        enterVRButton.disabled = !event.detail.supported;
      }, false);

      enterARButton.addEventListener('click', function (event) {
        unityInstance.Module.WebXR.toggleAR();
      }, false);
      enterVRButton.addEventListener('click', function (event) {
        unityInstance.Module.WebXR.toggleVR();
      }, false);
    </script>
  </body>
</html>
